profiles:
  Esp32-NFC:
    fqbn: esp32:esp32:esp32doit-devkit-v1:UploadSpeed=921600,FlashFreq=80,DebugLevel=none,EraseFlash=none
    platforms:
      - platform: esp32:esp32 (3.3.8)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    programmer: esptool
    port: COM3
    port_config:
      baudrate: "115200"
      bits: "8"
      parity: none
      stop_bits: one
    notes: Testing reading & writing to nfc tags
    libraries:
      - MFRC522 (1.4.12)
      - Adafruit SSD1306 (2.5.17)
      - Adafruit GFX Library (1.12.6)
      - Adafruit BusIO (1.17.4)
default_profile: Esp32-NFC
